<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassMaster | Quản lý lớp chủ nhiệm</title>

<!-- Thư viện đọc Excel và Word -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
:root{
  --blue:#2563eb;
  --dark:#0f172a;
  --bg:#f1f5f9;
  --border:#e2e8f0;
  --muted:#64748b;
  --green:#15803d;
  --red:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:#1e293b;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#1d4ed8,#60a5fa);
}
.login-card{
  background:white;
  width:100%;
  max-width:440px;
  padding:30px;
  border-radius:18px;
  box-shadow:0 15px 50px #0002;
}
.login-card h1{color:var(--blue)}
.field{margin:13px 0}
label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  color:#1e293b;
}
textarea{min-height:75px}
.btn{
  background:var(--blue);
  color:white;
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:600;
}
.btn:hover{opacity:.88}
.btn.secondary{background:#e2e8f0;color:#334155}
.btn.danger{background:var(--red)}
.btn.success{background:var(--green)}
.btn.small{padding:6px 10px;font-size:12px}
.full{width:100%}

.layout{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  background:var(--dark);
  color:white;
  padding:20px 13px;
  flex-shrink:0;
}
.brand{
  font-size:21px;
  font-weight:bold;
  padding:10px 12px 25px;
}
.nav-btn{
  display:block;
  width:100%;
  text-align:left;
  padding:12px;
  margin:4px 0;
  border:0;
  border-radius:8px;
  color:#cbd5e1;
  background:transparent;
}
.nav-btn:hover,.nav-btn.active{
  background:#334155;
  color:white;
}
.main{flex:1;min-width:0}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  background:white;
  padding:15px 22px;
  border-bottom:1px solid var(--border);
}
.topbar h2{margin:0;font-size:20px}
.content{
  padding:23px;
  max-width:1500px;
  margin:auto;
}
.panel,.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:19px;
  margin-bottom:18px;
}
.panel h3{margin-top:0}
.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:20px;
}
.stat-label{font-size:13px;color:var(--muted)}
.stat-value{font-size:25px;font-weight:bold;margin-top:9px}
.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:14px;
}
.toolbar input,.toolbar select{
  width:auto;
  min-width:160px;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.form-grid .field{margin:0}
.wide{grid-column:1/-1}
.table-wrap{overflow-x:auto}
table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
}
th,td{
  padding:11px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}
th{background:#f8fafc;color:var(--muted)}
td input{
  min-width:65px;
  padding:7px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.badge{
  padding:5px 9px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
}
.badge.admin{background:#fee2e2;color:#991b1b}
.badge.teacher{background:#dcfce7;color:#166534}
.badge.leader{background:#fef3c7;color:#92400e}
.badge.user{background:#e2e8f0;color:#334155}
.notice{
  padding:12px;
  background:#fffbeb;
  border:1px solid #fcd34d;
  border-radius:9px;
  color:#92400e;
  font-size:13px;
  line-height:1.5;
  margin-bottom:16px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}
.file-label{display:inline-block}
.file-label input{display:none}
hr{
  border:0;
  border-top:1px solid var(--border);
  margin:18px 0;
}
.score-good{color:#15803d;font-weight:bold}
.score-fair{color:#2563eb;font-weight:bold}
.score-pass{color:#d97706;font-weight:bold}
.score-low{color:#dc2626;font-weight:bold}
.group-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:12px 0;
}
.group-card{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px;
}
@media(max-width:900px){
  .sidebar{width:190px}
  .cards,.group-summary{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .layout{display:block}
  .sidebar{width:100%;padding:10px}
  .brand{padding:8px}
  .nav-list{display:flex;overflow-x:auto}
  .nav-btn{white-space:nowrap;width:auto}
  .content{padding:12px}
  .topbar{padding:13px}
  .form-grid{grid-template-columns:1fr}
  .wide{grid-column:auto}
}
</style>
</head>

<body>

<!-- =====================================
     ĐĂNG NHẬP / ĐĂNG KÝ
===================================== -->

<section id="loginScreen" class="login-screen">
<div class="login-card">
  <h1>🎓 ClassMaster</h1>
  <p>Hệ thống quản lý lớp chủ nhiệm</p>

  <div class="toolbar">
        <button class="btn" id="showLogin">Đăng nhập</button>
    <button class="btn secondary" id="showRegister">Đăng ký</button>
  </div>

  <form id="loginForm">
    <h3>Đăng nhập</h3>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" required>
    </div>

    <div class="field">
      <label>Mật khẩu</label>
      <input id="loginPassword" type="password" required>
    </div>

    <button class="btn full">Đăng nhập</button>
  </form>

  <form id="registerForm" class="hidden">
    <h3>Tạo tài khoản mới</h3>

    <div class="field">
      <label>Họ và tên</label>
      <input id="registerName" required>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="registerEmail" type="email" required>
    </div>

    <div class="field">
      <label>Mật khẩu</label>
      <input id="registerPassword" type="password"
             minlength="8" required>
    </div>

    <div class="field">
      <label>Xác nhận mật khẩu</label>
      <input id="confirmPassword" type="password"
             minlength="8" required>
    </div>

    <button class="btn full">Đăng ký</button>
  </form>

  <p id="authMessage" role="status"></p>
</div>
</section>

<!-- =====================================
     GIAO DIỆN CHÍNH
===================================== -->

<div id="app" class="layout hidden">

<aside class="sidebar">
  <div class="brand">🎓 ClassMaster</div>

  <div class="nav-list">
    <button class="nav-btn active" data-page="dashboard">
      🏠 Tổng quan
    </button>

    <button class="nav-btn" data-page="students">
      👨‍🎓 Học sinh
    </button>

    <button class="nav-btn" data-page="grades">
      📊 Quản lý điểm
    </button>

    <button class="nav-btn" data-page="leaves">
      📝 Giấy xin phép
    </button>

    <button class="nav-btn" data-page="fund">
      💰 Quỹ lớp
    </button>

    <button class="nav-btn" data-page="conduct">
      ⭐ Hạnh kiểm
    </button>

    <button class="nav-btn" data-page="groups">
      🏆 Thi đua 4 tổ
    </button>

    <button class="nav-btn hidden" id="adminNav"
            data-page="admin">
      ⚙️ Quản trị
    </button>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <h2 id="pageTitle">Tổng quan</h2>

  <div class="actions">
    <span id="userRole" class="badge"></span>
    <button class="btn secondary small" id="logoutBtn">
      Đăng xuất
    </button>
  </div>
</header>

<div class="content">
  <div class="notice">
    ClassMaster – Hệ thống quản lý lớp học.
    Bản hiện tại lưu dữ liệu trên trình duyệt.
  </div>

  <div id="pageContent"></div>
</div>

</main>
</div>

<script>
"use strict";

// ========================================
// 1. CẤU HÌNH VÀ DỮ LIỆU
// ========================================

// Email ADMIN cố định.
// Giữ lại tài khoản ADMIN cũ để không làm mất quyền đã có.
const ADMIN_EMAILS = [
  "anhduydl2012@gmail.com",
  "vietnammuonnam234567900@gmail.com"
];

const USERS_KEY = "classmaster_users_v3";
const DATA_KEY = "classmaster_data_v3";

let currentUser = null;
let currentPage = "dashboard";
let editingStudentId = null;

const defaultData = {
  students: [],
  grades: [],
  leaves: [],
  funds: [],
  conduct: [],
  teachers: [],
  groupLeaders: {},
  groupColumns: {
    1: [],
    2: [],
    3: [],
    4: []
  },
  weeklyRecords: []
};

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function loadUsers(){
  try{
    return JSON.parse(
      localStorage.getItem(USERS_KEY) || "[]"
    );
  }catch{
    return [];
  }
}

function saveUsers(users){
  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );
}

function loadData(){
  try{
    const old = JSON.parse(
      localStorage.getItem(DATA_KEY) || "{}"
    );

    return {
      ...defaultData,
      ...old,

      groupLeaders: old.groupLeaders || {},

      groupColumns: {
        1: [],
        2: [],
        3: [],
        4: [],
        ...(old.groupColumns || {})
      },

      weeklyRecords: old.weeklyRecords || []
    };

  }catch{
    return JSON.parse(JSON.stringify(defaultData));
  }
}

let db = loadData();

function saveData(){
  localStorage.setItem(
    DATA_KEY,
    JSON.stringify(db)
  );
}

// ========================================
// 2. PHÂN QUYỀN
// ========================================

function isAdmin(){
  return !!currentUser &&
    ADMIN_EMAILS.includes(currentUser.email);
}

function isTeacher(){
  return !!currentUser &&
    (isAdmin() ||
    db.teachers.includes(currentUser.email));
}

function leaderGroup(){
  if(!currentUser) return null;

  for(let group=1;group<=4;group++){
    if(db.groupLeaders[group] === currentUser.email){
      return group;
    }
  }

  return null;
}

function isGroupLeader(){
  return leaderGroup() !== null;
}

function canManageGroup(group){
  return isAdmin() ||
    isTeacher() ||
    Number(leaderGroup()) === Number(group);
}

function requireAdmin(){
  if(!isAdmin()){
    alert("Chỉ ADMIN mới có quyền thực hiện chức năng này.");
    return false;
  }

  return true;
