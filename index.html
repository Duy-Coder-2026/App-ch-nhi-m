<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassMaster | Quản lý lớp chủ nhiệm</title>

<style>
:root{
  --blue:#2563eb;
  --dark:#0f172a;
  --bg:#f1f5f9;
  --border:#e2e8f0;
  --muted:#64748b;
  --green:#15803d;
  --red:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:#1e293b;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-screen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(135deg,#1d4ed8,#60a5fa);
}
.login-card{
  background:white;
  width:100%;
  max-width:440px;
  padding:30px;
  border-radius:18px;
  box-shadow:0 15px 50px #0002;
}
.login-card h1{color:var(--blue)}
.field{margin:13px 0}
label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  color:#1e293b;
}
textarea{min-height:75px}
.btn{
  background:var(--blue);
  color:white;
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:600;
}
.btn:hover{opacity:.88}
.btn.secondary{background:#e2e8f0;color:#334155}
.btn.danger{background:var(--red)}
.btn.success{background:var(--green)}
.btn.small{padding:6px 10px;font-size:12px}
.full{width:100%}

.layout{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  background:var(--dark);
  color:white;
  padding:20px 13px;
  flex-shrink:0;
}
.brand{
  font-size:21px;
  font-weight:bold;
  padding:10px 12px 25px;
}
.nav-btn{
  display:block;
  width:100%;
  text-align:left;
  padding:12px;
  margin:4px 0;
  border:0;
  border-radius:8px;
  color:#cbd5e1;
  background:transparent;
}
.nav-btn:hover,.nav-btn.active{
  background:#334155;
  color:white;
}
.main{flex:1;min-width:0}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  background:white;
  padding:15px 22px;
  border-bottom:1px solid var(--border);
}
.topbar h2{margin:0;font-size:20px}
.content{
  padding:23px;
  max-width:1500px;
  margin:auto;
}
.panel,.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:19px;
  margin-bottom:18px;
}
.panel h3{margin-top:0}
.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
  margin-bottom:20px;
}
.stat-label{font-size:13px;color:var(--muted)}
.stat-value{font-size:25px;font-weight:bold;margin-top:9px}
.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:14px;
}
.toolbar input,.toolbar select{
  width:auto;
  min-width:160px;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.form-grid .field{margin:0}
.wide{grid-column:1/-1}
.table-wrap{overflow-x:auto}
table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
}
th,td{
  padding:11px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}
th{background:#f8fafc;color:var(--muted)}
td input{
  min-width:65px;
  padding:7px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
.badge{
  padding:5px 9px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
}
.badge.admin{background:#fee2e2;color:#991b1b}
.badge.teacher{background:#dcfce7;color:#166534}
.badge.leader{background:#fef3c7;color:#92400e}
.badge.user{background:#e2e8f0;color:#334155}
.notice{
  padding:12px;
  background:#fffbeb;
  border:1px solid #fcd34d;
  border-radius:9px;
  color:#92400e;
  font-size:13px;
  line-height:1.5;
  margin-bottom:16px;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}
.file-label{display:inline-block}
.file-label input{display:none}
hr{
  border:0;
  border-top:1px solid var(--border);
  margin:18px 0;
}
.score-good{color:#15803d;font-weight:bold}
.score-fair{color:#2563eb;font-weight:bold}
.score-pass{color:#d97706;font-weight:bold}
.score-low{color:#dc2626;font-weight:bold}
.group-summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:12px 0;
}
.group-card{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px;
}
@media(max-width:900px){
  .sidebar{width:190px}
  .cards,.group-summary{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:620px){
  .layout{display:block}
  .sidebar{width:100%;padding:10px}
  .brand{padding:8px}
  .nav-list{display:flex;overflow-x:auto}
  .nav-btn{white-space:nowrap;width:auto}
  .content{padding:12px}
  .topbar{padding:13px}
  .form-grid{grid-template-columns:1fr}
  .wide{grid-column:auto}
}
</style>
</head>

<body>

<!-- =====================================
     ĐĂNG NHẬP / ĐĂNG KÝ
===================================== -->

<section id="loginScreen" class="login-screen">
<div class="login-card">
  <h1>🎓 ClassMaster</h1>
  <p>Hệ thống quản lý lớp chủ nhiệm</p>

  <div class="toolbar">
    <button class="btn" id="showLogin">Đăng nhập</button>
    <button class="btn secondary" id="showRegister">Đăng ký</button>
  </div>

  <form id="loginForm">
    <h3>Đăng nhập</h3>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email" required>
    </div>

    <div class="field">
      <label>Mật khẩu</label>
      <input id="loginPassword" type="password" required>
    </div>

    <button class="btn full">Đăng nhập</button>
  </form>

  <form id="registerForm" class="hidden">
    <h3>Tạo tài khoản mới</h3>

    <div class="field">
      <label>Họ và tên</label>
      <input id="registerName" required>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="registerEmail" type="email" required>
    </div>

    <div class="field">
      <label>Mật khẩu</label>
      <input id="registerPassword" type="password"
             minlength="8" required>
    </div>

    <div class="field">
      <label>Xác nhận mật khẩu</label>
      <input id="confirmPassword" type="password"
             minlength="8" required>
    </div>

    <button class="btn full">Đăng ký</button>
  </form>

  <p id="authMessage" role="status"></p>
</div>
</section>

<!-- =====================================
     GIAO DIỆN CHÍNH
===================================== -->

<div id="app" class="layout hidden">

<aside class="sidebar">
  <div class="brand">🎓 ClassMaster</div>

  <div class="nav-list">
    <button class="nav-btn active" data-page="dashboard">
      🏠 Tổng quan
    </button>

    <button class="nav-btn" data-page="students">
      👨‍🎓 Học sinh
    </button>

    <button class="nav-btn" data-page="grades">
      📊 Quản lý điểm
    </button>

    <button class="nav-btn" data-page="leaves">
      📝 Giấy xin phép
    </button>

    <button class="nav-btn" data-page="fund">
      💰 Quỹ lớp
    </button>

    <button class="nav-btn" data-page="conduct">
      ⭐ Hạnh kiểm
    </button>

    <button class="nav-btn" data-page="groups">
      🏆 Thi đua 4 tổ
    </button>

    <button class="nav-btn hidden" id="adminNav"
            data-page="admin">
      ⚙️ Quản trị
    </button>
  </div>
</aside>

<main class="main">

<header class="topbar">
  <h2 id="pageTitle">Tổng quan</h2>

  <div class="actions">
    <span id="userRole" class="badge"></span>
    <button class="btn secondary small" id="logoutBtn">
      Đăng xuất
    </button>
  </div>
</header>

<div class="content">
  <div class="notice">
    ClassMaster – Hệ thống quản lý lớp học.
    Bản hiện tại lưu dữ liệu trên trình duyệt.
  </div>

  <div id="pageContent"></div>
</div>

</main>
</div>

<script>
"use strict";

// ========================================
// 1. CẤU HÌNH VÀ DỮ LIỆU
// ========================================

// Email ADMIN cố định.
// Giữ lại tài khoản ADMIN cũ để không làm mất quyền đã có.
const ADMIN_EMAILS = [
  "anhduydl2012@gmail.com",
  "vietnammuonnam234567900@gmail.com"
];

const USERS_KEY = "classmaster_users_v3";
const DATA_KEY = "classmaster_data_v3";

let currentUser = null;
let currentPage = "dashboard";
let editingStudentId = null;

const defaultData = {
  students: [],
  grades: [],
  leaves: [],
  funds: [],
  conduct: [],
  teachers: [],
  groupLeaders: {},
  groupColumns: {
    1: [],
    2: [],
    3: [],
    4: []
  },
  weeklyRecords: []
};

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,8);
}

function loadUsers(){
  try{
    return JSON.parse(
      localStorage.getItem(USERS_KEY) || "[]"
    );
  }catch{
    return [];
  }
}

function saveUsers(users){
  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );
}

function loadData(){
  try{
    const old = JSON.parse(
      localStorage.getItem(DATA_KEY) || "{}"
    );

    return {
      ...defaultData,
      ...old,

      groupLeaders: old.groupLeaders || {},

      groupColumns: {
        1: [],
        2: [],
        3: [],
        4: [],
        ...(old.groupColumns || {})
      },

      weeklyRecords: old.weeklyRecords || []
    };

  }catch{
    return JSON.parse(JSON.stringify(defaultData));
  }
}

let db = loadData();

function saveData(){
  localStorage.setItem(
    DATA_KEY,
    JSON.stringify(db)
  );
}

// ========================================
// 2. PHÂN QUYỀN
// ========================================

function isAdmin(){
  return !!currentUser &&
    ADMIN_EMAILS.includes(currentUser.email);
}

function isTeacher(){
  return !!currentUser &&
    (isAdmin() ||
    db.teachers.includes(currentUser.email));
}

function leaderGroup(){
  if(!currentUser) return null;

  for(let group=1;group<=4;group++){
    if(db.groupLeaders[group] === currentUser.email){
      return group;
    }
  }

  return null;
}

function isGroupLeader(){
  return leaderGroup() !== null;
}

function canManageGroup(group){
  return isAdmin() ||
    isTeacher() ||
    Number(leaderGroup()) === Number(group);
}

function requireAdmin(){
  if(!isAdmin()){
    alert("Chỉ ADMIN mới có quyền thực hiện chức năng này.");
    return false;
  }

  return true;
}

function requireTeacher(){
  if(!isTeacher()){
    alert("Bạn không có quyền GVCN.");
    return false;
  }

  return true;
}

function requireGroupManager(group){
  if(!canManageGroup(group)){
    alert("Bạn không có quyền quản lý tổ này.");
    return false;
  }

  return true;
}

function roleName(){
  if(isAdmin()) return "ADMIN";
  if(isTeacher()) return "GVCN";

  const group = leaderGroup();

  if(group){
    return "TỔ TRƯỞNG TỔ " + group;
  }

  return "USER";
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function money(value){
  return Number(value || 0).toLocaleString("vi-VN") + " đ";
}

function studentName(id){
  return db.students.find(s=>s.id===id)?.name ||
    "Học sinh đã xóa";
}

// ========================================
// 3. ĐĂNG NHẬP / ĐĂNG KÝ
// ========================================

const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

function authMessage(message,success=false){
  const el = document.getElementById("authMessage");

  el.textContent = message;
  el.style.color = success ? "#15803d" : "#dc2626";
}

document.getElementById("showLogin").onclick=()=>{
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
  authMessage("");
};

document.getElementById("showRegister").onclick=()=>{
  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  authMessage("");
};

registerForm.addEventListener("submit",e=>{
  e.preventDefault();

  const name = document.getElementById("registerName")
    .value.trim();

  const email = document.getElementById("registerEmail")
    .value.trim().toLowerCase();

  const password = document.getElementById("registerPassword")
    .value;

  const confirmPassword = document.getElementById("confirmPassword")
    .value;

  if(password.length < 8){
    return authMessage("Mật khẩu phải có ít nhất 8 ký tự.");
  }

  if(password !== confirmPassword){
    return authMessage("Mật khẩu xác nhận không khớp.");
  }

  const users = loadUsers();

  if(users.some(u=>u.email===email)){
    return authMessage("Email này đã tồn tại.");
  }

  users.push({
    id:uid(),
    name,
    email,
    password,
    role:"USER"
  });

  saveUsers(users);
  registerForm.reset();

  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");

  document.getElementById("loginEmail").value = email;

  authMessage("Đăng ký thành công! Hãy đăng nhập.",true);
});

loginForm.addEventListener("submit",e=>{
  e.preventDefault();

  const email = document.getElementById("loginEmail")
    .value.trim().toLowerCase();

  const password = document.getElementById("loginPassword")
    .value;

  const user = loadUsers().find(u=>
    u.email===email && u.password===password
  );

  if(!user){
    return authMessage("Email hoặc mật khẩu không chính xác.");
  }

  currentUser = {
    id:user.id,
    name:user.name,
    email:user.email
  };

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  updateRoleDisplay();

  currentPage = "dashboard";

  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.toggle(
      "active",
      b.dataset.page==="dashboard"
    );
  });

  loginForm.reset();
  render();
});

function updateRoleDisplay(){
  const role = document.getElementById("userRole");

  role.textContent = roleName();

  role.className =
    "badge " +
    (isAdmin() ? "admin" :
    isTeacher() ? "teacher" :
    isGroupLeader() ? "leader" : "user");

  document.getElementById("adminNav")
    .classList.toggle("hidden",!isAdmin());
}

document.getElementById("logoutBtn").onclick=()=>{
  currentUser = null;
  editingStudentId = null;

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");

  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");

  loginForm.reset();
  authMessage("");
};

// ========================================
// 4. ĐIỀU HƯỚNG
// ========================================

document.querySelectorAll(".nav-btn").forEach(button=>{
  button.addEventListener("click",()=>{

    const page = button.dataset.page;

    if(page==="admin" && !isAdmin()){
      alert("Chỉ ADMIN được truy cập.");
      return;
    }

    if(
      ["students","grades","leaves","fund","conduct"].includes(page) &&
      !isTeacher() &&
      page!=="students"
    ){
      alert("Chức năng này chỉ dành cho GVCN và ADMIN.");
      return;
    }

    currentPage = page;

    document.querySelectorAll(".nav-btn").forEach(b=>{
      b.classList.toggle("active",b===button);
    });

    render();
  });
});

function render(){

  const titles = {
    dashboard:"Tổng quan",
    students:"Quản lý học sinh",
    grades:"Quản lý điểm",
    leaves:"Giấy xin phép",
    fund:"Quỹ lớp",
    conduct:"Hạnh kiểm",
    groups:"Thi đua 4 tổ",
    admin:"Quản trị hệ thống"
  };

  const pages = {
    dashboard:dashboardPage,
    students:studentsPage,
    grades:gradesPage,
    leaves:leavesPage,
    fund:fundPage,
    conduct:conductPage,
    groups:groupsPage,
    admin:adminPage
  };

  if(!pages[currentPage]){
    currentPage = "dashboard";
  }

  document.getElementById("pageTitle").textContent =
    titles[currentPage];

  document.getElementById("pageContent").innerHTML =
    pages[currentPage]();

  updateRoleDisplay();

  bindPageEvents();

  if(currentPage==="groups"){
    renderGroupData();
    bindGroupDataEvents();
  }
}

// ========================================
// 5. TỔNG QUAN
// ========================================

function dashboardPage(){

  const balance = db.funds.reduce((sum,f)=>
    sum + (
      f.type==="Thu"
      ? Number(f.amount)
      : -Number(f.amount)
    ),0);

  const pending = db.leaves.filter(l=>
    l.status==="Chờ duyệt"
  ).length;

  const groupCount = [1,2,3,4].map(g=>
    getGroupStudents(g).length
  );

  return `
  <div class="cards">

    <div class="stat">
      <div class="stat-label">Tổng học sinh</div>
      <div class="stat-value">${db.students.length}</div>
    </div>

    <div class="stat">
      <div class="stat-label">Bản ghi điểm</div>
      <div class="stat-value">${db.grades.length}</div>
    </div>

    <div class="stat">
      <div class="stat-label">Đơn chờ duyệt</div>
      <div class="stat-value">${pending}</div>
    </div>

    <div class="stat">
      <div class="stat-label">Số dư quỹ</div>
      <div class="stat-value">${money(balance)}</div>
    </div>

  </div>

  <div class="panel">
    <h3>Xin chào, ${escapeHTML(currentUser.name)}!</h3>
    <p>Email: ${escapeHTML(currentUser.email)}</p>
    <p>Vai trò: <strong>${roleName()}</strong></p>
    <p>Chào mừng bạn đến với ClassMaster.</p>
  </div>

  <div class="panel">
    <h3>👥 Sĩ số 4 tổ</h3>
    <div class="group-summary">
      ${groupCount.map((n,i)=>`
        <div class="group-card">
          <strong>Tổ ${i+1}</strong>
          <div class="stat-value">${n}</div>
          <small>học sinh</small>
        </div>
      `).join("")}
    </div>
  </div>`;
}

// ========================================
// 6. QUẢN LÝ HỌC SINH
// ========================================

function studentsPage(){

  const rows = db.students.map((s,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${escapeHTML(s.code)}</td>
      <td>${escapeHTML(s.name)}</td>
      <td>${escapeHTML(s.gender)}</td>
      <td>${escapeHTML(s.dob)}</td>
      <td>${escapeHTML(s.phone)}</td>
      <td>Tổ ${Number(s.group)||1}</td>
      <td>
        ${isTeacher()?`
          <div class="actions">
            <button class="btn small secondary"
                    data-edit-student="${s.id}">
              Sửa
            </button>
            <button class="btn small danger"
                    data-delete-student="${s.id}">
              Xóa
            </button>
          </div>
        `:"—"}
      </td>
    </tr>
  `).join("");

  return `
  ${isTeacher()?`
  <div class="panel">
    <h3>${editingStudentId
      ? "Sửa thông tin học sinh"
      : "Thêm học sinh"}</h3>

    <form id="studentForm" class="form-grid">

      <div class="field">
        <label>Mã học sinh</label>
        <input name="code" required>
      </div>

      <div class="field">
        <label>Họ và tên</label>
        <input name="name" required>
      </div>

      <div class="field">
        <label>Giới tính</label>
        <select name="gender">
          <option>Nam</option>
          <option>Nữ</option>
          <option>Khác</option>
        </select>
      </div>

      <div class="field">
        <label>Ngày sinh</label>
        <input name="dob" type="date">
      </div>

      <div class="field">
        <label>Số điện thoại phụ huynh</label>
        <input name="phone">
      </div>

      <div class="field">
        <label>Thuộc tổ</label>
        <select name="group">
          <option value="1">Tổ 1</option>
          <option value="2">Tổ 2</option>
          <option value="3">Tổ 3</option>
          <option value="4">Tổ 4</option>
        </select>
      </div>

      <div class="field wide">
        <button class="btn">Lưu học sinh</button>
        <button type="button" class="btn secondary"
                id="cancelEdit">
          Hủy
        </button>
      </div>

    </form>

    <hr>

    <h3>Nhập danh sách từ file CSV</h3>

// ========================================

function parseCSV(text){

  const lines = [];
  let row = [];
  let value = "";
  let quoted = false;

  for(let i=0;i<text.length;i++){

    const c = text[i];

    if(c==='"'){

      if(quoted && text[i+1]==='"'){
        value += '"';
        i++;
      }else{
        quoted = !quoted;
      }

    }else if((c==="," || c===";") && !quoted){

      row.push(value.trim());
      value = "";

    }else if((c==="\n" || c==="\r") && !quoted){

      if(c==="\r" && text[i+1]==="\n") i++;

      row.push(value.trim());

      if(row.some(x=>x!=="")){
        lines.push(row);
      }

      row = [];
      value = "";

    }else{
      value += c;
    }
  }

  row.push(value.trim());

  if(row.some(x=>x!=="")){
    lines.push(row);
  }

  return lines;
}

function importStudents(file){

  const reader = new FileReader();

  reader.onload=()=>{

    try{

      const lines = parseCSV(
        String(reader.result).replace(/^\uFEFF/,"")
      );

      if(lines.length<2){
        throw Error("File không có dữ liệu.");
      }

      const header = lines[0].map(x=>
        x.trim().toLowerCase()
      );

      const expected = [
        "mahs","hoten","gioitinh","ngaysinh","sdt"
      ];

      const indexes = expected.map(key=>
        header.indexOf(key)
      );

      if(indexes.some(i=>i<0)){
        throw Error("Tiêu đề cột không đúng. Hãy tải file mẫu.");
      }

      let added = 0;
      let skipped = 0;

      for(const row of lines.slice(1)){

        const get = key=>
          row[indexes[expected.indexOf(key)]] || "";

        const code = get("mahs").trim();
        const name = get("hoten").trim();

        if(!code || !name){
          skipped++;
          continue;
        }

        if(db.students.some(s=>
          s.code.toLowerCase()===code.toLowerCase()
        )){
          skipped++;
          continue;
        }

        db.students.push({
          id:uid(),
          code,
          name,
          gender:get("gioitinh"),
          dob:get("ngaysinh"),
          phone:get("sdt"),
          group:1
        });

        added++;
      }

      saveData();
      alert(
        "Nhập thành công "+added+
        " học sinh. Bỏ qua "+skipped+" dòng."
      );

      render();

    }catch(error){
      alert("Lỗi nhập file: "+error.message);
    }
  };

  reader.onerror=()=>alert("Không thể đọc file.");

  reader.readAsText(file,"UTF-8");
}

function downloadCSV(filename,content){

  const blob = new Blob(
    ["\uFEFF"+content],
    {type:"text/csv;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  a.click();

  URL.revokeObjectURL(url);
}

function exportStudents(){

  const rows = [
    ["MaHS","HoTen","GioiTinh","NgaySinh","SDT","To"],

    ...db.students.map(s=>[
      s.code,
      s.name,
      s.gender,
      s.dob,
      s.phone,
      s.group || 1
    ])
  ];

  const csv = rows.map(row=>
    row.map(v=>
      '"'+String(v??"").replace(/"/g,'""')+'"'
    ).join(",")
  ).join("\r\n");

  downloadCSV("Danh_sach_hoc_sinh.csv",csv);
}

function getGroupStudents(group){
  return db.students.filter(s=>
    Number(s.group || 1) === Number(group)
  );
}

function getWeeklyRecord(studentId,week){
  return db.weeklyRecords.find(r=>
    r.studentId===studentId &&
    Number(r.week)===Number(week)
  );
}

// Xếp loại theo điểm thi đua.
function classifyScore(score){

  score = Number(score);

  if(score>=9) return "Tốt";
  if(score>=7) return "Khá";
  if(score>=5) return "Đạt";

  return "Chưa đạt";
}

function classificationClass(score){

  score = Number(score);

  if(score>=9) return "score-good";
  if(score>=7) return "score-fair";
  if(score>=5) return "score-pass";

  return "score-low";
}

// Tính điểm trung bình của các tuần đã nhập.
function getAverageScore(studentId){

  const records = db.weeklyRecords.filter(r=>
    r.studentId===studentId &&
    r.score!=="" &&
    r.score!==null &&
    r.score!==undefined
  );

  if(records.length===0) return null;

  const total = records.reduce(
    (sum,r)=>sum+Number(r.score),0
  );

  return total/records.length;
}

// Tính số tuần đã nhập điểm.
function getRecordedWeeks(studentId){

  return db.weeklyRecords.filter(r=>
    r.studentId===studentId &&
    r.score!=="" &&
    r.score!==null &&
    r.score!==undefined
  ).length;
}

            </tr>
          `}

  <div class="panel">

      Các tuần chưa nhập không bị tính là 0.

                Chưa có học sinh.
              </td>
            </tr>
          `}
        </tbody>
      </table>
    </div>
  </div>
  `;
}

// 13. QUẢN TRỊ ADMIN
// ========================================

function adminPage(){

  if(!isAdmin()){
    return "<p>Bạn không có quyền truy cập.</p>";
  }

  const users = loadUsers();

  const rows = users.map((u,i)=>{

    const admin = ADMIN_EMAILS.includes(u.email);
    const teacher = db.teachers.includes(u.email);

    let leaderOf = null;

    for(let g=1;g<=4;g++){
      if(db.groupLeaders[g]===u.email){
        leaderOf = g;
      }
    }

    const role = admin
      ? "ADMIN"
      : teacher
        ? "GVCN"
        : leaderOf
          ? "TỔ TRƯỞNG TỔ "+leaderOf
          : "USER";

    return `
    <tr>
      <td>${i+1}</td>
      <td>${escapeHTML(u.name)}</td>
      <td>${escapeHTML(u.email)}</td>
      <td><strong>${role}</strong></td>

      <td>
        ${admin
          ? "Tài khoản ADMIN cố định"
          : `
          <div class="actions">

            ${
              teacher
              ? `
                <button class="btn small danger"
                        data-revoke="${escapeHTML(u.email)}">
                  Thu hồi GVCN
                </button>
              `
              : `
                <button class="btn small success"
                        data-grant="${escapeHTML(u.email)}">

            ${

    return `
      <tr>
        <td>Tổ ${g}</td>

        <td>${email?escapeHTML(email):"—"}</td>

  return `

    <h3>⚙️ Quản trị tài khoản</h3>

    <p>
      ADMIN có thể cấp/thu hồi quyền GVCN,
      phân công và xóa quyền Tổ trưởng.

        <thead>

            <th>#</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Thao tác</th>
          </tr>

        <tbody>
          ${rows || `
            <tr>
              <td colspan="5" class="empty">
                Chưa có tài khoản.
              </td>

// ========================================
// 14. GẮN SỰ KIỆN CÁC TRANG
// ========================================

function bindPageEvents(){

  // --------------------------------------
  // HỌC SINH
  // --------------------------------------

  const sf = document.getElementById("studentForm");

  if(sf){

    sf.onsubmit=e=>{

      e.preventDefault();

      if(!requireTeacher()) return;

      const f = new FormData(sf);

      const item = {
        code:f.get("code").trim(),
        name:f.get("name").trim(),
        gender:f.get("gender"),
        dob:f.get("dob"),
        phone:f.get("phone").trim(),
        group:Number(f.get("group") || 1)
      };

      if(!item.code || !item.name) return;

      const duplicate = db.students.some(s=>
        s.code.toLowerCase()===item.code.toLowerCase() &&
        s.id!==editingStudentId
      );

      if(duplicate){
        return alert("Mã học sinh đã tồn tại.");
      }

      if(editingStudentId){

        const index = db.students.findIndex(s=>
          s.id===editingStudentId
        );

        if(index>=0){
          db.students[index] = {
            ...db.students[index],
            ...item
          };
        }

      }else{

        db.students.push({
          id:uid(),
          ...item
        });
      }

      editingStudentId = null;

      saveData();
      render();
    };

    document.getElementById("cancelEdit").onclick=()=>{
      editingStudentId = null;
      render();
    };
  }

  // Sửa học sinh
  document.querySelectorAll("[data-edit-student]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        const s = db.students.find(x=>
          x.id===btn.dataset.editStudent
        );

        if(!s) return;

        editingStudentId = s.id;
        render();

        const form = document.getElementById("studentForm");

        ["code","name","gender","dob","phone","group"]
          .forEach(k=>{
            if(form.elements[k]){
              form.elements[k].value =
                s[k] ?? (k==="group"?1:"");
            }
          });
      };
    });

  // Xóa học sinh
  document.querySelectorAll("[data-delete-student]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        if(!confirm("Bạn có chắc muốn xóa học sinh này?")){
          return;
        }

        const id = btn.dataset.deleteStudent;

        db.students = db.students.filter(s=>s.id!==id);

        saveData();
        render();
      };
    });

  // Tìm học sinh
  const search = document.getElementById("studentSearch");

  if(search){

    search.oninput=()=>{

      const q = search.value.toLowerCase();

      document.querySelectorAll("#studentRows tr")
        .forEach(row=>{
          row.hidden =
            !row.textContent.toLowerCase().includes(q);
        });
    };
  }

  // Nhập CSV
  const file = document.getElementById("studentFile");

  if(file){

    file.onchange=()=>{

      if(!requireTeacher()) return;

      if(file.files[0]){
        importStudents(file.files[0]);
      }

      file.value = "";
    };
  }

  // Tải mẫu CSV
  const template = document.getElementById("downloadTemplate");

  if(template){

    template.onclick=()=>{

      downloadCSV(
        "Mau_danh_sach_hoc_sinh.csv",
        "MaHS,HoTen,GioiTinh,NgaySinh,SDT\r\n"+
        "HS001,Nguyen Van A,Nam,2012-01-01,0123456789\r\n"
      );
    };
  }

  // Xuất CSV
  const exportButton = document.getElementById("exportStudents");

  if(exportButton){
    exportButton.onclick=()=>{
      if(requireTeacher()) exportStudents();
    };
  }

  // --------------------------------------
  // ĐIỂM
  // --------------------------------------

  const gf = document.getElementById("gradeForm");

  if(gf){

    gf.onsubmit=e=>{

      e.preventDefault();

      if(!requireTeacher()) return;

      const f = new FormData(gf);
      const score = Number(f.get("score"));

      if(score<0 || score>10){
        return alert("Điểm phải từ 0 đến 10.");
      }

      db.grades.push({
        id:uid(),
        studentId:f.get("studentId"),
        subject:f.get("subject").trim(),
        type:f.get("type"),
        score,
        date:f.get("date")
      });

      saveData();
      render();
    };
  }

  document.querySelectorAll("[data-delete-grade]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        if(!confirm("Xóa điểm này?")) return;

        db.grades = db.grades.filter(g=>
          g.id!==btn.dataset.deleteGrade
        );

        saveData();
        render();
      };
    });

  // --------------------------------------
  // GIẤY XIN PHÉP
  // --------------------------------------

  const lf = document.getElementById("leaveForm");

  if(lf){

    lf.onsubmit=e=>{

      e.preventDefault();

      if(!requireTeacher()) return;

      const f = new FormData(lf);

      db.leaves.push({
        id:uid(),
        studentId:f.get("studentId"),
        date:f.get("date"),
        reason:f.get("reason").trim(),
        status:"Chờ duyệt"
      });

      saveData();
      render();
    };
  }

  document.querySelectorAll("[data-leave]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        const [id,status] = btn.dataset.leave.split("|");

        const leave = db.leaves.find(l=>l.id===id);

        if(leave){
          leave.status = status;
        }

        saveData();
        render();
      };
    });

  document.querySelectorAll("[data-delete-leave]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        if(!confirm("Xóa đơn xin phép này?")) return;

        db.leaves = db.leaves.filter(l=>
          l.id!==btn.dataset.deleteLeave
        );

        saveData();
        render();
      };
    });

  // --------------------------------------
  // QUỸ LỚP
  // --------------------------------------

  const ff = document.getElementById("fundForm");

  if(ff){

    ff.onsubmit=e=>{

      e.preventDefault();

      if(!requireTeacher()) return;

      const f = new FormData(ff);
      const amount = Number(f.get("amount"));

      if(amount<=0){
        return alert("Số tiền không hợp lệ.");
      }

      db.funds.push({
        id:uid(),
        type:f.get("type"),
        amount,
        date:f.get("date"),
        description:f.get("description").trim(),
        note:f.get("note").trim()
      });

      saveData();
      render();
    };
  }

  document.querySelectorAll("[data-delete-fund]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        if(!confirm("Xóa giao dịch này?")) return;

        db.funds = db.funds.filter(f=>
          f.id!==btn.dataset.deleteFund
        );

        saveData();
        render();
      };
    });

  // --------------------------------------
  // HẠNH KIỂM
  // --------------------------------------

  const cf = document.getElementById("conductForm");

  if(cf){

    cf.onsubmit=e=>{

      e.preventDefault();

      if(!requireTeacher()) return;

      const f = new FormData(cf);

      db.conduct.push({
        id:uid(),
        studentId:f.get("studentId"),
        term:f.get("term"),
        rating:f.get("rating"),
        note:f.get("note").trim()
      });

      saveData();
      render();
    };
  }

  document.querySelectorAll("[data-delete-conduct]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireTeacher()) return;

        if(!confirm("Xóa xếp loại này?")) return;

        db.conduct = db.conduct.filter(c=>
          c.id!==btn.dataset.deleteConduct
        );

        saveData();
        render();
      };
    });

  // --------------------------------------
  // ADMIN CẤP QUYỀN GVCN
  // --------------------------------------

  document.querySelectorAll("[data-grant]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireAdmin()) return;

        const email = btn.dataset.grant;

        if(!loadUsers().some(u=>u.email===email)){
          return alert("Tài khoản không tồn tại.");
        }

        if(!db.teachers.includes(email)){
          db.teachers.push(email);
        }

        saveData();
        render();

        alert("Đã cấp quyền GVCN cho "+email);
      };
    });

  // ADMIN THU HỒI QUYỀN GVCN
  document.querySelectorAll("[data-revoke]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireAdmin()) return;

        const email = btn.dataset.revoke;

        if(!confirm("Thu hồi quyền GVCN của "+email+"?")){
          return;
        }

        db.teachers = db.teachers.filter(x=>x!==email);

        saveData();
        render();
      };
    });

  // --------------------------------------
  // ADMIN PHÂN CÔNG TỔ TRƯỞNG
  // --------------------------------------

  document.querySelectorAll("[data-assign-leader]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireAdmin()) return;

        const email = btn.dataset.assignLeader;
        const index = btn.dataset.userIndex;

        const select = document.getElementById(
          "leaderGroup_"+index
        );

        const group = Number(select.value);

        const users = loadUsers();

        if(!users.some(u=>u.email===email)){
          return alert("Tài khoản không tồn tại.");
        }

        const oldLeader = db.groupLeaders[group];

        if(oldLeader && oldLeader!==email){

          const ok = confirm(
            "Tổ "+group+" đã có tổ trưởng là "+
            oldLeader+". Bạn có muốn thay thế không?"
          );

          if(!ok) return;
        }

        // Mỗi tài khoản chỉ giữ một quyền tổ trưởng.
        for(let g=1;g<=4;g++){

          if(db.groupLeaders[g]===email){
            delete db.groupLeaders[g];
          }
        }

        db.groupLeaders[group] = email;

        saveData();
        render();

        alert(
          "Đã phân quyền Tổ trưởng tổ "+
          group+" cho "+email
        );
      };
    });

  // --------------------------------------
  // ADMIN XÓA QUYỀN TỔ TRƯỞNG
  // --------------------------------------

  document.querySelectorAll("[data-remove-leader]")
    .forEach(btn=>{

      btn.onclick=()=>{

        if(!requireAdmin()) return;

        const group = Number(btn.dataset.removeLeader);
        const email = db.groupLeaders[group];

        if(!email) return;

        if(!confirm(
          "Bạn có chắc muốn xóa quyền Tổ trưởng tổ "+
          group+" của "+email+"?"
        )){
          return;
        }

        delete db.groupLeaders[group];

        saveData();
        render();

        alert("Đã thu hồi quyền Tổ trưởng tổ "+group+".");
      };
    });

  // --------------------------------------
  // SAO LƯU DỮ LIỆU
  // --------------------------------------

  const backup = document.getElementById("backupData");

  if(backup){

    backup.onclick=()=>{

      if(!requireAdmin()) return;

      const data = {
        students:db.students,
        grades:db.grades,
        leaves:db.leaves,
        funds:db.funds,
        conduct:db.conduct,
        teachers:db.teachers,
        groupLeaders:db.groupLeaders,
        groupColumns:db.groupColumns,
        weeklyRecords:db.weeklyRecords
      };

      const blob = new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "ClassMaster_Backup.json";
      a.click();

      URL.revokeObjectURL(url);
    };
  }
}

// ========================================
// 15. SỰ KIỆN BẢNG THI ĐUA
// ========================================

function bindGroupDataEvents(){

  // Chuyển tổ
  const groupSelect = document.getElementById("selectedGroup");

  if(groupSelect){

    groupSelect.onchange=()=>{
      renderGroupData();
      bindGroupDataEvents();
    };
  }

  // Chuyển tuần
  const weekSelect = document.getElementById("selectedWeek");

  if(weekSelect){

    weekSelect.onchange=()=>{
      renderGroupData();
      bindGroupDataEvents();
    };
  }

  // LƯU ĐIỂM THI ĐUA
  const saveButton = document.getElementById("saveWeeklyData");

  if(saveButton){

    saveButton.onclick=()=>{

      const group = Number(
        document.getElementById("selectedGroup").value
      );

      const week = Number(
        document.getElementById("selectedWeek").value
      );

      if(!requireGroupManager(group)) return;

      const students = getGroupStudents(group);
      const columns = db.groupColumns[group] || [];

      const pendingRecords = [];

      // Kiểm tra toàn bộ dữ liệu trước khi lưu.
      for(const student of students){

        const scoreInput = document.querySelector(
          `[data-score="${student.id}"]`
        );

        const speechesInput = document.querySelector(
          `[data-speeches="${student.id}"]`
        );

        const talkingInput = document.querySelector(
          `[data-talking="${student.id}"]`
        );

        const scoreText = scoreInput.value.trim();

        const score = scoreText===""
          ? ""
          : Number(scoreText);

        const speeches = Number(speechesInput.value || 0);
        const talking = Number(talkingInput.value || 0);

        if(score!=="" && (
          !Number.isFinite(score) ||
          score<0 ||
          score>10
        )){
          return alert(
            "Điểm của "+student.name+
            " phải từ 0 đến 10."
          );
        }

        if(
          !Number.isInteger(speeches) ||
          speeches<0 ||
          !Number.isInteger(talking) ||
          talking<0
        ){
          return alert(
            "Số lần phát biểu và nói chuyện phải là số nguyên không âm."
          );
        }

        const custom = {};

        columns.forEach(col=>{

          const input = document.querySelector(
            `[data-custom="${col.id}"][data-student="${student.id}"]`
          );

          custom[col.id] = input ? input.value : "";
        });

        pendingRecords.push({
          studentId:student.id,
          group,
          week,
          score,
          speeches,
          talking,
          custom
        });
      }

      // Lưu hoặc cập nhật bản ghi.
      pendingRecords.forEach(data=>{

        let record = db.weeklyRecords.find(r=>
          r.studentId===data.studentId &&
          Number(r.week)===week
        );

        if(record){

          Object.assign(record,data);

        }else{

          db.weeklyRecords.push({
            id:uid(),
            ...data
          });
        }
      });

      saveData();

      alert(
        "Đã lưu dữ liệu thi đua tuần "+
        week+" của tổ "+group+"."
      );

      renderGroupData();
      bindGroupDataEvents();
    };
  }

  // THÊM CỘT MỚI
  const addButton = document.getElementById("addGroupColumn");

  if(addButton){

    addButton.onclick=()=>{

      const group = Number(
        document.getElementById("selectedGroup").value
      );

      if(!requireGroupManager(group)) return;

      const name = prompt(
        "Nhập tên cột mới.\n"+
        "Ví dụ: Trực nhật, Vệ sinh, Đồng phục..."
      );

      if(!name || !name.trim()) return;

      if(!db.groupColumns[group]){
        db.groupColumns[group] = [];
      }

      const duplicate = db.groupColumns[group].some(c=>
        c.name.toLowerCase()===name.trim().toLowerCase()
      );

      if(duplicate){
        return alert("Tên cột này đã tồn tại.");
      }

      db.groupColumns[group].push({
        id:uid(),
        name:name.trim()
      });

      saveData();

      renderGroupData();
      bindGroupDataEvents();

      alert("Đã thêm cột mới cho tổ "+group+".");
    };
  }
}
